name: CI

on:
  push:
    branches: [main]
  pull_request:

# リポジトリを読むだけ（書き込みの権限を持たせない）
permissions:
  contents: read

jobs:
  build:
    # SpeechAnalyzer など macOS 26 の SDK が必要
    runs-on: macos-26
    steps:
      # ソースは git で取らず、このコミットのアーカイブ（tarball）を API で取って広げる。
      # git で取ると GitHub が clone として数え、README のダウンロード数（git clone の人数）に CI の分が入るため。
      # 履歴が無いので、このビルドのビルド番号（コミット数）は 1 になる（CI のビルドは確かめるだけで配らない）
      - name: Source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" -o "$RUNNER_TEMP/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/source.tar.gz" --strip-components=1 -C "$GITHUB_WORKSPACE"
          rm "$RUNNER_TEMP/source.tar.gz"
          test -x scripts/test.sh
      - name: Toolchain
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Translations
        run: python3 scripts/l10n.py check
      - name: Build (universal)
        run: scripts/build.sh --universal
      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 dist/JellyfishAI.app
          codesign -d --verbose=2 dist/JellyfishAI.app 2>&1 | grep -q 'flags=.*runtime'
          lipo -archs dist/JellyfishAI.app/Contents/MacOS/JellyfishAI | grep -q x86_64
          lipo -archs dist/JellyfishAI.app/Contents/MacOS/JellyfishAI | grep -q arm64
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/JellyfishAI.app/Contents/Info.plist
